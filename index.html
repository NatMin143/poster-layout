<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0D2F3A"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tourism Layout Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;800&family=Inter:wght@400;600&family=Sora:wght@400;700&family=Manrope:wght@400;700&family=DM+Serif+Display&family=DM+Sans:wght@400;600&family=Space+Mono&family=Great+Vibes&family=Bebas+Neue&family=Oswald&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6ECEA;--ink:#10252B;--mut:#5B6F74;--ac:#2447D0;--ln:#B9C6C4;--pn:#F6F9F8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0F1D21;--ink:#E3ECEA;--mut:#8FA3A6;--ac:#7C98FF;--ln:#2A3E43;--pn:#162A2F}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Inter',sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{min-height:44px;padding:0 14px;border:1px solid var(--ln);background:var(--pn);border-radius:4px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{border-color:var(--ac);color:var(--ac)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select,textarea{width:100%;min-height:44px;padding:8px;border:1px solid var(--ln);background:var(--pn);border-radius:4px}
#app{height:100%;display:flex;flex-direction:column}
.scr{flex:1;overflow:auto;padding:18px 16px 24px}
.mono{font-family:'Space Mono',monospace;font-size:11px;color:var(--mut);letter-spacing:.04em}
h1{font:800 34px/1 'Playfair Display',serif;margin:6px 0 8px}h2{font:600 13px 'Space Mono',monospace;margin:22px 0 10px;border-bottom:1px solid var(--ln);padding-bottom:6px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--pn);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;min-height:52px}nav .on{box-shadow:inset 0 -3px var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1 1 auto}
.card{display:flex;gap:12px;border-top:1px solid var(--ln);padding:12px 0}
.th{flex:none;overflow:hidden;box-shadow:0 0 0 1px var(--ln);background:#fff}
.card div.i{flex:1;min-width:0}
.bar{display:flex;align-items:center;gap:6px;padding:6px 8px;border-bottom:1px solid var(--ln);background:var(--pn)}
.bar b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.tools{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;background:var(--pn);border-top:1px solid var(--ln)}.tools button{flex:none}
.stage{flex:1;overflow:auto;display:grid;place-items:start safe center;padding:12px;min-height:0}
.sheet{max-height:46%;overflow:auto;background:var(--pn);border-top:2px solid var(--ac);padding:12px}
.sheet label{display:block;margin:8px 0 2px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ins{border-left:3px solid var(--ac);padding:4px 10px;margin:6px 0;background:var(--bg)}
.cvw{position:relative;box-shadow:0 0 0 1px var(--ln)}.cv{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.cv .e{position:absolute;overflow:hidden}.cv .e svg{width:100%;height:100%;display:block}
.cv .sel{outline:6px solid #2447D0;outline-offset:2px}.cv .ph{display:grid;place-items:center;text-align:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#0001 0 12px,#0000 12px 24px);border:3px dashed #0007;font:24px 'Space Mono',monospace;padding:20px;color:#000a}
.ly{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--ln)}.ly button{min-width:44px;padding:0}.ly .n{flex:1;text-align:left;border:0;background:none}
.ck{padding:6px 0;border-bottom:1px solid var(--ln)}.ok{color:#1b8a4b}.wn{color:#b7791f}.ms{color:#c53030}
.modal{position:fixed;inset:0;background:var(--bg);z-index:9;overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
pre,#out{font:12px 'Space Mono',monospace;white-space:pre-wrap}
.err{border:1px solid #c53030;padding:10px;color:#c53030;white-space:pre-wrap;font:12px 'Space Mono',monospace;margin:8px 0}
/* v2.0 theme */
:root{--bg:#DCE5E2;--ink:#0D2530;--mut:#587078;--ac:#C8552E;--ln:#B3C3C0;--pn:#EBF0EC;--hd:#0D2F3A}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1A20;--ink:#DCE8E6;--mut:#8AA3A8;--ac:#F08A5D;--ln:#24404A;--pn:#12272F;--hd:#081419}}
body{font-size:13px}button{font-size:12.5px;min-height:40px;padding:0 12px}.mono{font-size:10px}h1{font-size:28px}h2{font-size:11px;letter-spacing:.08em}
.bar,nav,.tools{background:var(--hd);color:#fff;border-color:#0004}.bar button,.tools button{background:#ffffff14;border-color:#ffffff26;color:#fff}nav button{background:none;border:0;color:#cfe0e3}nav .on{color:#fff;box-shadow:inset 0 -3px var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}.bar button.on,.tools button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));overflow:visible}.tools button{padding:0}
.stage{background:radial-gradient(#0002 1px,transparent 1px) 0 0/14px 14px,var(--bg)}.sheet{background:var(--pn)}
.ft{position:fixed;z-index:5;display:none;gap:4px;padding:4px;background:var(--hd);border-radius:6px;box-shadow:0 4px 16px #0006}.ft button,.ft .cl{min-height:32px;font-size:11px;padding:0 8px;background:#ffffff18;color:#fff;border:1px solid #ffffff30;border-radius:4px;display:flex;align-items:center;gap:4px;margin:0}.ft input[type=color]{width:24px;min-height:24px;padding:0;border:0}
.sw{display:flex;height:16px;margin-top:4px}.sw i{flex:1}
.stage{touch-action:pan-x pan-y}.cv .e.sel{touch-action:none}#rh{position:fixed;z-index:6;width:24px;height:24px;border-radius:50%;background:var(--ac);border:3px solid #fff;touch-action:none;display:none}
</style></head><body><div id="app"></div>

function genPrompt(){const v=i=>$(i).value.trim(),ls=[...document.querySelectorAll('.g-l:checked')].map(x=>x.value);
 return `You are designing a template for TOURISM LAYOUT STUDIO, a template-based tourism layout editor. Return ONLY one valid JSON template, no commentary.

TEMPLATE
- Name: ${v('#g-n')}
- Category: ${v('#g-c')} (HM 302 assignment option ${v('#g-o')})
- Visual style: ${v('#g-s')}
- Layout characteristics: ${ls.join(', ')||'your choice'}
- Required content fields:\n${v('#g-f').split('\n').filter(Boolean).map(x=>'  • '+x).join('\n')}
- Special design instructions: ${v('#g-d')||'none'}

SCHEMA
Top-level: schemaVersion "1.3", template {id,name,category,assignmentOption,style,description,tags}, canvas {width:1000,height:1414,format:"A2",orientation:"portrait"} (A2 portrait 42×59.4 cm; coordinates are in this 1000×1414 space), theme {background,primary,secondary,displayFont,bodyFont}, contentSchema {}, elements [].
Each element: id, type, label, instruction (what the user should put here), editable, required (true for must-fill content), rec (true for recommended), lock (true to prevent move/resize), position {x,y,w,h}, style {size,weight,font:"d"|"b",color,lh,ls,align,bg,border,radius,pad,opacity,rotate}.
Allowed types ONLY: ${TYPES.join(', ')}. Text-like types (${TXT.join(', ')}) use "text" with "ph":true while placeholder; image/map use "src":""; svg/icon use "svg" (inline SVG, currentColor, single quotes); route uses "points":[[x,y],...] inside its own box; mapMarker uses "text"; sourceList uses "items":[]; shape/line/divider use style.bg. Canvas may be A2 (1000×1414) or 18×24 in (1000×1333).

RULES
- Every important element is separately editable. Do not flatten the design or use a poster PNG as background.
- Use scalable SVG for decorations (contours, waves, routes, compass, markers, rules).
- Configurable typography via theme fonts (style.font "d" display / "b" body).
- Include instructions for every editable element, required fields, and a source list.
- Do NOT fabricate geographic information, coordinates, prices, travel times or facts. Use clearly marked placeholders and map slots for user-supplied verified content.
- Schema 1.1 style keys: grad, tg (text gradient), fade (bottom|top|left|right|edges), shape (${Object.keys(SH).join('|')}), card (${Object.keys(CARD).join('|')}), ovg (CSS gradient overlay on images), ovb (overlay blend), vig (vignette), tr also accepts duotone, pad, pat (${Object.keys(PAT).join('|')}) with patc, frame (${Object.keys(FRAME).join('|')}), eff (outline|highlight|shadow3d|arc), blend, shadow, tt, vert, accent (wrap words in *asterisks* in text), mask (circle|ellipse|arch), tr, zoom, px, py, ov/ova; font "s" = script; icon elements accept "icon": ${Object.keys(ICONS).join(', ')}.
- Colors: use one small consistent palette (background, dark, light, accent, mid) because users can recolor a template by those roles.
- Make the layout original, uncluttered, with clear hierarchy and readable text sizes for A2 print.`}
